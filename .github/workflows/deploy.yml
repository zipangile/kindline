name: Fly Deploy
on:
  push:
    branches:
      - main
jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v4
      - name: Verify Fly.io Token
        run: |
          if [ -z "${{ secrets.FLY_API_TOKEN }}" ]; then
            echo "Error: FLY_API_TOKEN secret is missing or empty."
            echo "Please go to Repository Settings > Secrets and variables > Actions and add FLY_API_TOKEN."
            exit 1
          fi
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_TOKEN: ${{ secrets.FLY_API_TOKEN }}
